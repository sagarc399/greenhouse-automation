# Application
spring.application.name=greenhouse-app
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/greenhouse_db
spring.datasource.username=postgres
spring.datasource.password=postgre123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# i18n
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# OAuth2 Gmail
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Frontend base URL — OAuth2 success handler redirects here after login.
# In Railway, set the APP_FRONTEND_BASE_URL environment variable to the
# deployed frontend URL (e.g. https://my-frontend.up.railway.app).
# Spring Boot's relaxed binding maps APP_FRONTEND_BASE_URL → app.frontend.base-url
# automatically, but the explicit ${...} syntax works on all platforms.
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}

# Trust the X-Forwarded-* headers injected by Railway's reverse proxy so that
# Spring Security generates HTTPS redirect URIs and sets secure cookies.
server.forward-headers-strategy=framework

# Cross-origin session cookie — required when the frontend (Vercel) and backend
# (Railway) are on different domains.  SameSite=None allows the browser to send
# the JSESSIONID cookie on cross-origin requests; Secure is mandatory whenever
# SameSite=None is used (browsers reject None without Secure).
# domain is left empty so the cookie is scoped to the Railway hostname only.
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.domain=

# Springdoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Logging
logging.level.com.greenhouse=INFO
logging.level.org.springframework.security=WARN
